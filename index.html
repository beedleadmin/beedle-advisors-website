<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BEEDLE ADVISORS</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>

    :root {
      color-scheme: light dark;
      --page: #fbfbfa;
      --text: #171717;
      --muted: #777772;
      --border: rgba(23, 23, 23, 0.14);
      --hover: rgba(23, 23, 23, 0.055);
      --ring: rgba(23, 23, 23, 0.18);
      --ease: cubic-bezier(0.65, 0, 0.35, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111110;
        --text: #f3f3ef;
        --muted: #a0a099;
        --border: rgba(255, 255, 255, 0.14);
        --hover: rgba(255, 255, 255, 0.06);
        --ring: rgba(255, 255, 255, 0.2);
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--page);
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 300ms var(--ease), color 300ms var(--ease);
    }

    .page {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      padding:
        max(clamp(1.5rem, 3.5vh, 3rem), env(safe-area-inset-top))
        clamp(1.1rem, 5vw, 5rem)
        max(1rem, env(safe-area-inset-bottom));
      overflow: hidden;
    }

    .hero {
      width: min(100%, 64rem);
      height: 100%;
      min-height: 0;
      margin-inline: auto;
      display: grid;
      grid-template-rows:
        minmax(1rem, 0.72fr)
        auto
        auto
        minmax(3rem, 1.25fr)
        auto
        minmax(2.4rem, 0.75fr);
      justify-items: center;
      align-items: center;
      text-align: center;
    }

    .logo {
      grid-row: 2;
      display: block;
      width: clamp(10.75rem, 17vw, 15.5rem);
      height: auto;
      margin: 0 0 clamp(1.35rem, 2.7vh, 2.1rem);
      opacity: 0;
      transform: translateY(0.5rem);
      animation: reveal 850ms 80ms var(--ease) forwards;
      transition: filter 300ms var(--ease);
    }

    .identity {
      grid-row: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: Georgia, "Times New Roman", Times, serif;
      line-height: 1;
      opacity: 0;
      transform: translateY(0.45rem);
      animation: reveal 850ms 180ms var(--ease) forwards;
    }

    .beedle {
      display: block;
      padding-left: 0.17em;
      font-size: clamp(3rem, 6vw, 5.8rem);
      font-weight: 400;
      letter-spacing: 0.17em;
      white-space: nowrap;
    }

    .advisors {
      display: block;
      margin-top: clamp(0.72rem, 1.5vh, 1.05rem);
      color: var(--muted);
      font-size: clamp(1.22rem, 2vw, 1.72rem);
      font-weight: 500;
      letter-spacing: 0.19em;
      white-space: nowrap;
    }

    .contact {
      grid-row: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.78rem;
      margin: 0;
      opacity: 0;
      transform: translateY(0.35rem);
      animation: reveal 760ms 330ms var(--ease) forwards;
    }

    .contact-label {
      margin: 0;
      color: var(--muted);
      font-size: 0.58rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      line-height: 1;
      text-transform: uppercase;
    }

    .email-icon {
      display: inline-grid;
      place-items: center;
      width: 2.9rem;
      height: 2.9rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      text-decoration: none;
      transition:
        background-color 180ms var(--ease),
        border-color 180ms var(--ease),
        transform 180ms var(--ease);
    }

    .email-icon svg {
      width: 1rem;
      height: 1rem;
      stroke-width: 1.5;
    }

    .email-icon:hover {
      background: var(--hover);
      transform: translateY(-2px);
    }

    .email-icon:focus-visible {
      outline: 3px solid var(--ring);
      outline-offset: 4px;
    }

    .copyright {
      margin: 0;
      color: var(--muted);
      font-size: 0.54rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      line-height: 1.4;
      text-align: center;
      text-transform: uppercase;
      opacity: 0;
      animation: fade-in 650ms 480ms var(--ease) forwards;
    }

    @keyframes reveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fade-in {
      to {
        opacity: 1;
      }
    }

    @media (prefers-color-scheme: dark) {
      .logo {
        filter: invert(1);
      }
    }

    @media (max-width: 40rem) {
      .page {
        padding:
          max(1.15rem, env(safe-area-inset-top))
          1rem
          max(0.85rem, env(safe-area-inset-bottom));
      }

      .hero {
        grid-template-rows:
          minmax(0.7rem, 0.6fr)
          auto
          auto
          minmax(2.4rem, 1.2fr)
          auto
          minmax(1.8rem, 0.8fr);
      }

      .logo {
        width: clamp(8.7rem, 35vw, 10.6rem);
        margin-bottom: clamp(1rem, 2.3vh, 1.3rem);
      }

      .beedle {
        padding-left: 0.12em;
        font-size: clamp(2.55rem, 12vw, 3.55rem);
        letter-spacing: 0.12em;
      }

      .advisors {
        margin-top: 0.62rem;
        font-size: clamp(1.1rem, 5.2vw, 1.4rem);
        letter-spacing: 0.145em;
      }

      .contact {
        gap: 0.72rem;
      }

      .email-icon {
        width: 2.8rem;
        height: 2.8rem;
      }
    }

    @media (max-width: 22rem) {
      .logo {
        width: 7.9rem;
      }

      .beedle {
        font-size: 2.32rem;
        letter-spacing: 0.085em;
      }

      .advisors {
        font-size: 1.02rem;
        letter-spacing: 0.11em;
      }
    }

    @media (max-height: 43rem) and (orientation: portrait) {
      .page {
        padding-top: max(0.85rem, env(safe-area-inset-top));
        padding-bottom: max(0.65rem, env(safe-area-inset-bottom));
      }

      .hero {
        grid-template-rows:
          minmax(0.3rem, 0.45fr)
          auto
          auto
          minmax(1.35rem, 1.05fr)
          auto
          minmax(1rem, 0.75fr);
      }

      .logo {
        width: clamp(7.4rem, 28vw, 8.7rem);
        margin-bottom: 0.76rem;
      }

      .beedle {
        font-size: clamp(2.18rem, 9.5vw, 2.9rem);
      }

      .advisors {
        margin-top: 0.48rem;
        font-size: 1rem;
      }

      .contact {
        gap: 0.56rem;
      }

      .email-icon {
        width: 2.5rem;
        height: 2.5rem;
      }
    }

    @media (max-height: 32rem) and (orientation: landscape) {
      .page {
        padding:
          0.75rem
          max(clamp(1.2rem, 4vw, 3rem), env(safe-area-inset-right))
          max(0.5rem, env(safe-area-inset-bottom))
          max(clamp(1.2rem, 4vw, 3rem), env(safe-area-inset-left));
      }

      .hero {
        width: min(100%, 48rem);
        height: auto;
        align-self: center;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        grid-template-rows: auto auto;
        grid-template-areas:
          "logo identity"
          "logo contact";
        column-gap: clamp(1.8rem, 5vw, 3.6rem);
        row-gap: 1rem;
        justify-items: center;
        align-items: center;
      }

      .logo {
        grid-area: logo;
        width: clamp(7.6rem, 18vw, 10rem);
        margin: 0;
      }

      .identity {
        grid-area: identity;
        align-self: end;
      }

      .beedle {
        font-size: clamp(2.25rem, 6.8vw, 3.75rem);
      }

      .advisors {
        margin-top: 0.45rem;
        font-size: clamp(1rem, 2.8vw, 1.3rem);
      }

      .contact {
        grid-area: contact;
        flex-direction: row;
        gap: 0.82rem;
        align-self: start;
      }

      .copyright {
        font-size: 0.5rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body,
      .logo,
      .email-icon {
        transition: none;
      }

      .logo,
      .identity,
      .contact,
      .copyright {
        opacity: 1;
        transform: none;
        animation: none;
      }
    }

  </style>
</head>
<body>
  <main class="page">
    <section class="hero" aria-labelledby="brand-name">
      <img class="logo" src="beedle-logo.png" alt="Beedle Advisors beetle logo">
      <div class="identity" id="brand-name">
        <span class="beedle">BEEDLE</span>
        <span class="advisors" aria-hidden="true">— ADVISORS —</span>
      </div>

<div class="contact">
        <p class="contact-label">Contact</p>
        <a class="email-icon" href="mailto:hello@beedleadvisors.com"
          aria-label="Email BEEDLE ADVISORS" title="Email BEEDLE ADVISORS">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="14" x="3" y="5" rx="2"></rect>
            <path d="m3 7 9 6 9-6"></path>
          </svg>
        </a>
      </div>
    </section>

    <p class="copyright">© 2026 BEEDLE ADVISORS</p>
  </main>
</body>
</html>
